esphome:
  name: ac-jn52n
  friendly_name: "Johnson JN52N AC"

esp8266:
  board: esp01_1m

external_components:
  - source:
      type: local
      path: components
    components: [tcl_climate]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  min_auth_mode: WPA2
  ap:

captive_portal:

logger:
  baud_rate: 0

api:

ota:
  platform: esphome

uart:
  id: uart_bus
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600
  parity: EVEN

climate:
  - platform: tcl_climate
    id: tcl_custom_climate
    uart_id: uart_bus
    name: "Johnson JN52N"
    icon: "mdi:fan"

# Note: vertical and horizontal swing are motorized and controlled over UART.
# Status byte 10: bit6 = vertical on/off, bit5 = horizontal on/off.
# This model does NOT report vane positions (bytes 51/52 always 0xFF); the
# physical remote only toggles on/off per axis. Fix/Move options are experimental.
# Humidity and power consumption are NOT available over UART on this model.

switch:
  - platform: template
    name: "Beep"
    id: beep_switch
    icon: "mdi:bell"
    turn_on_action:
      - lambda: 'id(tcl_custom_climate).set_beep(true);'
    turn_off_action:
      - lambda: 'id(tcl_custom_climate).set_beep(false);'
    lambda: |-
      return id(tcl_custom_climate).get_beep();

select:
  - platform: template
    name: "Vertical Swing"
    id: vswing
    entity_category: config
    options:
      - "Last position"
      - "Fix top"
      - "Fix upper"
      - "Fix mid"
      - "Fix lower"
      - "Fix bottom"
      - "Move full"
      - "Move upper"
      - "Move lower"
    lambda: |-
      return id(tcl_custom_climate).vswing_pos;
    set_action:
      then:
        - lambda: |-
            id(tcl_custom_climate).control_vertical_swing(x);

  - platform: template
    name: "Horizontal Swing"
    id: hswing
    entity_category: config
    options:
      - "Last position"
      - "Fix left"
      - "Fix mid left"
      - "Fix mid"
      - "Fix mid right"
      - "Fix right"
      - "Move full"
      - "Move left"
      - "Move mid"
      - "Move right"
    lambda: |-
      return id(tcl_custom_climate).hswing_pos;
    set_action:
      then:
        - lambda: |-
            id(tcl_custom_climate).control_horizontal_swing(x);

sensor:
  - platform: template
    name: "Ambient Temperature"
    id: ambient_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    lambda: |-
      return id(tcl_custom_climate).get_current_temperature();
    update_interval: 10s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
