esphome:
  name: salon-aire
  friendly_name: "AC Salon"

esp8266:
  board: esp01_1m

external_components:
  - source:
      type: local
      path: components
    components: [tcl_climate]

wifi:
  ssid: !secret iot_wifi_ssid
  password: !secret iot_wifi_password
  power_save_mode: none
  fast_connect: true
  min_auth_mode: WPA2
  ap:
    ssid: "AC-Salon"
    password: "slwf01pro"

captive_portal:

logger:
  baud_rate: 0
  level: VERBOSE

api:

ota:
  platform: esphome

uart:
  id: uart_bus
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600
  parity: EVEN

climate:
  - platform: tcl_climate
    id: tcl_custom_climate
    uart_id: uart_bus
    name: "Aire Salon"
    icon: "mdi:fan"

# Nota: este modelo no tiene oscilacion horizontal motorizada.
# El ajuste horizontal es manual (fisico). Solo se expone swing vertical.
# Humedad y consumo electrico NO estan disponibles por UART en este modelo.

switch:
  - platform: template
    name: "Pitido"
    id: pitido_switch
    icon: "mdi:bell"
    turn_on_action:
      - lambda: 'id(tcl_custom_climate).set_beep(true);'
    turn_off_action:
      - lambda: 'id(tcl_custom_climate).set_beep(false);'
    lambda: |-
      return id(tcl_custom_climate).get_beep();

select:
  - platform: template
    name: "Swing Vertical"
    id: vswing
    entity_category: config
    options:
      - "Last position"
      - "Fix top"
      - "Fix upper"
      - "Fix mid"
      - "Fix lower"
      - "Fix bottom"
      - "Move full"
    lambda: |-
      return id(tcl_custom_climate).vswing_pos;
    set_action:
      then:
        - lambda: |-
            id(tcl_custom_climate).control_vertical_swing(x);

sensor:
  - platform: template
    name: "Temperatura Ambiente AC"
    id: temp_ambiente_ac
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    lambda: |-
      return id(tcl_custom_climate).get_current_temperature();
    update_interval: 10s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
